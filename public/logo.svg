<svg viewBox="0 0 200 220" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Navy Circle -->
  <circle cx="100" cy="85" r="80" fill="#02164F" />
  
  <!-- White Gap Ring -->
  <circle cx="100" cy="85" r="74" fill="#FFFFFF" />
  
  <!-- Orange Fill Circle -->
  <circle cx="100" cy="85" r="69" fill="#F37022" />
  
  <!-- Horizontal Navy Band -->
  <rect x="20" y="66" width="160" height="38" fill="#02164F" />
  
  <!-- Devanagari Script text (इण्डियनऑयल) inside Navy Band -->
  <text x="100" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Devanagari', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">इण्डियनऑयल</text>
  
  <!-- English Logo Text below Circle -->
  <text x="100" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="28" font-weight="900" fill="#02164F" text-anchor="middle" letter-spacing="1">IndianOil</text>
</svg>
